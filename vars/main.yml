---
# Map kernel architecture to Traefik release asset naming.
traefik_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv6l: armv6
  armv7l: armv7
  i386: "386"
  i686: "386"
  ppc64le: ppc64le
  riscv64: riscv64
  s390x: s390x

# Architecture name used in the Traefik release asset for this host.
traefik_arch: >-
  {{ traefik_arch_map[ansible_facts['architecture']]
     | default(ansible_facts['architecture']) }}

# Scratch files for the pre-activation startup probe (see configure.yml).
# Copies of the rendered static configuration, rewritten to bind every entry
# point to an ephemeral port so the probe never disturbs the running service,
# plus a throwaway ACME store so the probe can never touch the real one.
traefik_check_static_file: /tmp/traefik-role-check-static.yml
traefik_check_dynamic_file: /tmp/traefik-role-check-dynamic.yml
traefik_check_acme_storage: /tmp/traefik-role-check-acme.json
