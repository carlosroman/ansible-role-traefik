---
- name: Restart Traefik
  ansible.builtin.systemd_service:
    name: "{{ traefik_service_name }}"
    state: restarted
  # A first install has no running service to restart: the play's "Enable
  # and start Traefik" task launches the new binary, so restarting right
  # after it would only bounce a process that never served anything. The
  # gate reads the pre-install stat from install.yml: replacing a binary
  # that was already there does restart.
  when: traefik_binary_stat.stat.exists
