---
# Desired state of the Traefik installation, mirroring ansible.builtin.apt:
#   present -- keep exactly the traefik_version pin installed, downgrading
#     when the installed binary reports another version; with an empty
#     traefik_version the first install resolves and installs the latest
#     release and an installed binary is then never touched again (apt
#     present does not upgrade).
#   latest -- converge to the newest release, resolved via the GitHub API
#     from the controller on every converge; a replaced binary restarts the
#     service. Cannot be combined with traefik_version.
#   absent -- stop and disable the service and remove the systemd unit and
#     the binary (like apt remove, not purge): the service user and group,
#     traefik_config_dir and traefik_data_dir, acme.json private keys
#     included, survive for a future re-install.
traefik_state: present

# Traefik version to install (e.g. "v3.7.19" or "3.7.19"), the exact-pin
# mechanism: traefik_state=present converges to it, downgrades included.
# Empty with traefik_state=present means the latest release is resolved at
# the first install and never re-resolved while a binary exists. Empty with
# traefik_state=latest tracks the newest release every converge. Setting it
# together with traefik_state=latest is an error.
traefik_version: ""

# GitHub location of the published Traefik release binaries.
traefik_github_owner: traefik
traefik_github_repo: traefik

# Directory the traefik binary is installed into.
traefik_install_dir: /usr/local/bin

# Directory holding the static configuration file (traefik.yml).
traefik_config_dir: /etc/traefik

# Writable directory for Traefik data such as acme.json.
traefik_data_dir: /var/lib/traefik

# Service user and group Traefik runs as.
traefik_user: traefik
traefik_group: traefik

# Name of the systemd service managed by this role.
traefik_service_name: traefik

# Port of the "web" (HTTP) entrypoint.
traefik_http_port: 80

# Enable the "websecure" (HTTPS) entrypoint.
traefik_enable_https: false

# Port of the "websecure" (HTTPS) entrypoint.
traefik_https_port: 443

# Enable the "traefik" entrypoint exposing the dashboard and API.
traefik_enable_dashboard: false

# Port of the "traefik" (dashboard/API) entrypoint.
traefik_dashboard_port: 8080

# ACME certificate resolver (all opt-ins). Rendering of a
# certificatesResolvers section is gated on this email address: while it is
# empty the static configuration is exactly what this role wrote before ACME
# support existed. Routers reference the rendered resolver as
# certResolver: letsencrypt.
traefik_acme_email: ""

# ACME CA directory URL. The default is the Let's Encrypt production endpoint;
# https://acme-staging-v02.api.letsencrypt.org/directory is the staging
# endpoint, meant for proving issuance and renewal without burning through
# production rate limits.
traefik_acme_ca_server: "https://acme-v02.api.letsencrypt.org/directory"

# LEGO account/certificate store for the resolver. The role creates the file
# 0600 owned by the service user before the first start; it holds private
# keys and must never be world-readable.
traefik_acme_storage: "{{ traefik_data_dir }}/acme.json"

# DNS-01 challenge provider for the resolver (e.g. route53). Empty means the
# resolver falls back to Traefik's default HTTP-01 challenge. Credentials are
# NOT configured here: lego reads them from the environment file, so no secret
# ever lands in the world-readable static configuration.
traefik_acme_dns_provider: ""

# Wait before Traefik checks DNS propagation, as a Go duration string
# (e.g. "30s"). Empty uses the Traefik default of no delay; lego still runs
# its own provider-managed propagation wait afterwards.
traefik_acme_dns_delay: ""

# Custom DNS servers (host:port) used for the propagation check, e.g. the
# authoritative servers of the delegated zone.
traefik_acme_dns_resolvers: []

# Skip the DNS propagation check entirely (lego's own timeout applies).
traefik_acme_dns_disable_propagation_check: false

# Optional environment file sourced by the systemd unit. While it is empty
# the unit gets no EnvironmentFile line, except that a configured
# traefik_acme_dns_provider defaults this to <traefik_config_dir>/env so lego
# can read provider credentials (e.g. AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_REGION for route53). The file itself is managed
# out-of-band (vault, consuming playbook), never by this role.
traefik_env_file: ""

# Opt-in for Traefik's file provider: renders providers.file (watched) into
# the static configuration and deploys the dynamic fragments below. While it
# is false nothing file-provider related is touched.
traefik_enable_file_provider: false

# Watched directory the dynamic fragments are deployed into (0750, readable
# by the service group that runs Traefik).
traefik_dynamic_config_dir: /etc/traefik/dynamic

# Dynamic fragments as a dict of file name to Traefik dynamic configuration
# structure, e.g. { jellyfin.yml: { http: { routers: ..., services: ... } } }.
# Values are rendered as YAML; fragment names removed from the dict are
# deleted from the directory.
traefik_dynamic_configs: {}

# Extra top-level options merged into the static configuration file.
# Given as a YAML dict, e.g. { log: { level: DEBUG } }.
traefik_config_extras: {}
