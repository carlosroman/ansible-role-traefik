---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=true cache_valid_time=600
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

  roles:
    - role: carlosroman.traefik
      vars:
        traefik_version: v3.7.18
        traefik_enable_dashboard: true

  post_tasks:
    - name: Check Traefik systemd unit file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/traefik.service
      register: traefik_unit_file

    - name: Assert Traefik systemd unit file is installed
      ansible.builtin.assert:
        that:
          - traefik_unit_file.stat.exists
          - traefik_unit_file.stat.isreg
        fail_msg: Traefik systemd unit file is missing

    - name: Check Traefik static configuration file exists
      ansible.builtin.stat:
        path: /etc/traefik/traefik.yml
      register: traefik_config_file

    - name: Assert Traefik static configuration file is installed
      ansible.builtin.assert:
        that:
          - traefik_config_file.stat.exists
        fail_msg: Traefik static configuration file is missing

    - name: Check Traefik binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/traefik
      register: traefik_binary_file

    - name: Assert Traefik binary is installed
      ansible.builtin.assert:
        that:
          - traefik_binary_file.stat.exists
          - traefik_binary_file.stat.mode == "0755"
        fail_msg: Traefik binary is missing or not executable

    - name: Gather Traefik service state
      ansible.builtin.systemd_service:
        name: traefik
      register: traefik_service
      changed_when: false

    - name: Assert Traefik service is enabled and active
      ansible.builtin.assert:
        that:
          - traefik_service.status.UnitFileState == "enabled"
          - traefik_service.status.ActiveState == "active"
        fail_msg: Traefik service is not enabled or not active

    - name: Assert Traefik version matches the pinned version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/traefik
          - version
      register: traefik_version_output
      changed_when: false

    - name: Check Traefik version output
      ansible.builtin.assert:
        that:
          - "'3.7.18' in (traefik_version_output.stdout ~ traefik_version_output.stderr)"
        fail_msg: Traefik binary is not the expected version

    - name: Wait for the web entrypoint
      ansible.builtin.wait_for:
        port: 80
        timeout: 30

    - name: Wait for the dashboard entrypoint
      ansible.builtin.wait_for:
        port: 8080
        timeout: 30

    - name: Read the static configuration file
      ansible.builtin.slurp:
        src: /etc/traefik/traefik.yml
      register: default_config_content

    - name: Assert the default render touches no optional sections
      ansible.builtin.assert:
        that:
          - "'certificatesResolvers' not in rendered_config"
          - "'acme' not in rendered_config"
          - "'providers' not in rendered_config"
        fail_msg: The default converge rendered optional configuration
      vars:
        rendered_config: "{{ default_config_content.content | b64decode }}"

    - name: Read the systemd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/traefik.service
      register: default_unit_content

    - name: Assert the default unit has no EnvironmentFile line
      ansible.builtin.assert:
        that:
          - "'EnvironmentFile' not in unit_text"
        fail_msg: The default unit references an environment file
      vars:
        unit_text: "{{ default_unit_content.content | b64decode }}"

    - name: Check for an ACME storage file
      ansible.builtin.stat:
        path: /var/lib/traefik/acme.json
      register: default_acme_stat

    - name: Assert the default converge created no ACME storage file
      ansible.builtin.assert:
        that:
          - not default_acme_stat.stat.exists
        fail_msg: The default converge created acme.json

    - name: Check for the dynamic configuration directory
      ansible.builtin.stat:
        path: /etc/traefik/dynamic
      register: default_dynamic_stat

    - name: Assert the default converge created no dynamic configuration
      ansible.builtin.assert:
        that:
          - not default_dynamic_stat.stat.exists
        fail_msg: The default converge created the file provider directory
